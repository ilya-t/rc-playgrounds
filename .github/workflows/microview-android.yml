name: MicroView Android APK (v2)

on:
  push:
    branches:
      - microview-android-v2
    paths:
      - 'microview-controller/**'
      - '.github/workflows/microview-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Another project on master contains an unrecognized wrapper JAR.
          # This job uses a pinned installed Gradle, not that wrapper.
          validate-wrappers: false
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test command protocol and MicroView watchdog
        run: bash microview-controller/tests/run_tests.sh
      - name: Build debug APK
        working-directory: microview-controller/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-MicroView-v2-debug-apk
          path: microview-controller/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30